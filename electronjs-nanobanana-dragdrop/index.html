<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>ElectroBanana</title>
    <style>
      #image-drop-area {
        border: 2px dashed #ccc;
        border-radius: 20px;
        width: 100%;
        height: 200px;
        display: flex;
        justify-content: space-around;
        align-items: center;
      }
      .image-placeholder {
        width: 150px;
        height: 150px;
        border: 1px solid #eee;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        color: #aaa;
      }
      .image-placeholder.dragover {
        border-color: #000;
        background-color: #eee;
      }
      .image-placeholder img {
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>
  <body>
    <h1>🍌 ElectroBanana</h1>
    <p>Drag and drop two images below and enter a prompt.</p>

    <div id="image-drop-area">
        <div id="image1" class="image-placeholder"></div>
        <div id="image2" class="image-placeholder"></div>
    </div>

    <input type="text" id="prompt" placeholder="Enter your prompt here">
    <button id="submit">Generate</button>

    <div id="result-image"></div>

    <script src="./renderer.js"></script>
  </body>
</html>
