apiVersion: kine-matic.io/v1alpha1
kind: TextGeneration
metadata:
  name: bedtime-story-text
spec:
  prompt: "Write a short, imaginative bedtime story for a 5-year-old about a friendly robot who explores the moon."
  engine: GeminiCLI
  output:
    path: "bedtime-story-en.md"

---

apiVersion: kine-matic.io/v1alpha1
kind: TextGeneration
metadata:
  name: bedtime-story-text-it
spec:
  prompt: "Translate the following text to Italian: ${TextGeneration/bedtime-story-text.output.content}"
  engine: GeminiCLI
  output:
    path: "bedtime-story-it.md"
  depends_on:
    - "TextGeneration/bedtime-story-text"

---

apiVersion: kine-matic.io/v1alpha1
kind: AudioGeneration
metadata:
  name: bedtime-story-audio-it
spec:
  depends_on:
    - "TextGeneration/bedtime-story-text-it" # translate from EN to IT
  model: "chirp3"
  language: "italian" # it-IT-Chirp3-HD-Achernar
  engine: GeminiCLI
  output:
    path: "bedtime-story-it.wav"

---

apiVersion: kine-matic.io/v1alpha1
kind: ImageGeneration
metadata:
  name: story-illustration
spec:
  replicas: 4
  depends_on:
    - "TextGeneration/bedtime-story-text" # Use plot to constuct image
  prompt: "A beautiful, colorful illustration of a friendly robot exploring the moon, for a children's bedtime story. The style should be whimsical and dreamlike. Based on the story: ${TextGeneration/bedtime-story-text.output.content}"
  engine: GeminiCLI
  output:
    # note that this should create 4 files: story-illustration_1.png, story-illustration_2.png, ...
    path: "story-illustration.png"

---

apiVersion: kine-matic.io/v1alpha1
kind: AudioGeneration
metadata:
  name: bedtime-story-audio-en
spec:
  depends_on:
    - "TextGeneration/bedtime-story-text"
  model: "chirp3"
  language: "english"
  engine: GeminiCLI
  output:
    path: "bedtime-story-en.wav"

---

apiVersion: kine-matic.io/v1alpha1
kind: TextGeneration
metadata:
  name: final-story-en
spec:
  prompt: |
    Create a markdown file content as described below.

    **Remember** to output ONLY the content of the markdown file, and nothing else.

    Also add a markdown link to the audio, if at all possible: "${kine.output_dir}/bedtime-story-en.wav".
    If not, link it like a normal link: [${kine.output_dir}/bedtime-story-en.wav](${kine.output_dir}/bedtime-story-en.wav).

    ```markdown
    # <Gemini: A title for the story>

    [${kine.output_dir}/bedtime-story-en.wav](${kine.output_dir}/bedtime-story-en.wav) <-- Gemini: link to audio file if possible!
    ![Story Illustration 1](${kine.output_dir}/story-illustration_1.png)
    ![Story Illustration 2](${kine.output_dir}/story-illustration_2.png)
    ![Story Illustration 3](${kine.output_dir}/story-illustration_3.png)
    ![Story Illustration 4](${kine.output_dir}/story-illustration_4.png)

    # Story

    ${TextGeneration/bedtime-story-text.output.content}
    ```
  engine: GeminiCLI
  output:
    path: "FINAL_STORY.EN.md"
  eval:
    prompt: |
      Ensure it's a markdown file with the specified structure.
      Ensure all linked resources (audio, images) reference EXISTING files.
    # deterministic:
    #   file_exists: "FINAL_STORY.EN.md"
    solution: rename
  depends_on:
    - "TextGeneration/bedtime-story-text"
    - "AudioGeneration/bedtime-story-audio-en"
    - "ImageGeneration/story-illustration"

---

apiVersion: kine-matic.io/v1alpha1
kind: TextGeneration
metadata:
  name: final-story-it
spec:
  prompt: |
    Create a markdown file content as described below.

    **Remember** to output ONLY the content of the markdown file, and nothing else.

    Also add a markdown link to the audio, if at all possible: "${kine.output_dir}/bedtime-story-it.wav".
    If not, link it like a normal link: [${kine.output_dir}/bedtime-story-it.wav](${kine.output_dir}/bedtime-story-it.wav).

    ```markdown
    # <Gemini: A title for the story in Italian>

    [${kine.output_dir}/bedtime-story-it.wav](${kine.output_dir}/bedtime-story-it.wav) <-- Gemini: link to audio file if possible!
    ![Story Illustration 1](${kine.output_dir}/story-illustration_1.png)
    ![Story Illustration 2](${kine.output_dir}/story-illustration_2.png)
    ![Story Illustration 3](${kine.output_dir}/story-illustration_3.png)
    ![Story Illustration 4](${kine.output_dir}/story-illustration_4.png)

    # Story (in Italian)

    ${TextGeneration/bedtime-story-text-it.output.content}
    ```
  engine: GeminiCLI
  output:
    path: "FINAL_STORY.IT.md"
  depends_on:
    - "TextGeneration/bedtime-story-text-it"
    - "AudioGeneration/bedtime-story-audio-it"
    - "ImageGeneration/story-illustration"
