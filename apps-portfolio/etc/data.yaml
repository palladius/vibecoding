  - title: '[workshop][tentative] Create a responsive Rails 8 app with Gemini'
    event: Euruko 2025
    date: '2025-09-18'
    location: Viana do Castelo, Portugal
    country_code: pt
    session_url: https://2025.euruko.org/speakers/riccardo_carlesso
    event_url: https://2025.euruko.org/
    status: cfp_applied
    tags:
      - Ruby
      - Rails
      - workshop
    talk_description: >
      In this workshop, we will create a Rails 8 app from scratch, using the
      latest

      features of Ruby on Rails. We will cover topics such as:

      - Setting up a Rails app with Docker

      - Using Google Cloud Run to deploy the app

      - Using Google Cloud Build to automate the deployment process

      - Using Google Cloud Monitoring to monitor the app

      - Using Google Cloud Logging to log the app

      - Using Google Cloud Storage to store files
    image: /images/generated/Euruko-2025-2025-09-18.jpeg
  - title: 'From Monolith 🗿 to Magic ✨: An AI-Powered DevOps Workshop'
    event: We are Developers 2025
    date: '2025-07-10'
    location: Berlin, Germany
    country_code: de
    session_url: >-
      https://www.wearedevelopers.com/world-congress/agenda-overview?_gl=1%2a18o7uk4%2a_up%2aMQ..%2a_gs%2aMQ..&gclid=CjwKCAjw9anCBhAWEiwAqBJ-cwOlrjXaoNq5uIjxOKitDJ6olzgF4dPBqzAOwMfxulLxQLPG_QHGVxoCWaYQAvD_BwE&gbraid=0AAAAADEgEv_NMlk7LrLlKXLsAtS8tqeml#
    event_url: https://www.wearedevelopers.com/world-congress
    status: confirmed
    event_description: >
      WAD is the biggest dev event in Europe, with over 10,000

      attendees and 200+ speakers. Riccardo will lead a workshop on how to use
      AI

      to improve DevOps practices.
    talk_description: >
      Tired of the slow, manual grind of modernizing applications? What if you
      could containerize 📦, deploy 🚀, refactor, and add powerful new AI
      features with seamless automation? In this hands-on workshop, we'll do
      exactly that.


      For all the DevOps gurus, we'll roll up our sleeves and tame the beast 🗿.
      You'll get hands-on experience containerizing a legacy app with Docker,
      deploying it to the serverless bliss of Google Cloud Run, and building a
      rock-solid, fully automated CI/CD pipeline. We'll even use Gemini to help
      us refactor and clean up our code, because who doesn't love AI-powered
      code reviews? 🔧


      And for the AI adventurers, prepare for the WOW moment! We'll unleash the
      power of Generative AI by building an event-driven function that uses the
      Gemini Vision model to automatically analyze images the moment they're
      uploaded. The secret sauce? A "magic" 🪄 Cloud Run file mount that makes
      our AI integration seamless, powerful, and ridiculously cool. 🤖✨


      This isn't just a talk; it's a hands-on lab where you'll leave with a
      deployed, AI-enhanced application and the skills to automate and innovate
      in your own work. Let's build something awesome together!
    tags:
      - CICD
      - CloudRun
      - AI
      - Gemini
      - workshop
      - highlight
    image: /images/generated/We-are-Developers-2025-2025-07-10.jpeg
