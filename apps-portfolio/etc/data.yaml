about_me:
  bio: 'Former network administrator, sysadmin, and Ruby on Rails developer, Riccardo
    has been in operations for 20+ years and still likes to spend time coding (better
    if Ruby). He loves engaging with customers and help them run their operations
    reliably and successfully in the cloud. Riccardo loves caipirinhas and 🍷 Amarone,
    playing 🎹 piano and 🏊🏻🚴🏿🏃‍♀️ triathlons; he''s been passionate about Mathematics
    since he was 4.

    Riccardo Carlesso is a Developer Advocate at Google Cloud, where he helps developers
    build amazing applications. He is a passionate software engineer with a love for
    Ruby, Bash, and all things cloud. When he''s not coding, you can find him speaking
    at conferences, writing articles, or watching Sacha Baron Cohen movies.

    Note: this is a public facing version of my pvt go/ricc-conferences where I hold
    state (like Manager/Wife approval).

    '
