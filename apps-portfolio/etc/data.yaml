  - title: 'Browser Infestati, AI Cinema: Dirigere la Tua Storia con Gemini CLI'
    event: Devfest Pescara 2025
    date: '2025-11-08'
    location: Pescara, Italy
    country_code: it
    status: accepted
    talk_description: 'In questa sessione, riveleremo Gemini CLI come due strumenti
      rivoluzionari in uno. Per prima cosa, mostreremo il "Browser Infestato": il
      sogno di ogni sviluppatore web. Vedremo come il Model Context Protocol (MCP)
      connette l''LLM a Playwright, automatizzando noiose attività web come cliccare
      pulsanti, effettuare il login e navigare siti, un vero "nuovo curl". Poi, per
      qualcosa di completamente diverso, sveleremo l''"AI Cinema": uno studio per
      creatori. Guarda come usiamo la CLI per dirigere e generare intere trame video
      multi-step da un singolo prompt. 🤖 Due potenti demo, un unico strumento, e mostreremo
      come entrambi possono essere automatizzati nel cloud con GitHub Actions.

      '
