  - title: '[WS] Rails + Gemini + MCP: Parla con il tuo DB, Crea Immagini Divertenti 🖼️'
    event: DevFest Modena 2025
    date: '2025-10-04'
    location: Modena, Italy
    country_code: it
    event_url: https://devfest.modena.it/
    tags:
      - GenAI
      - DevFest
      - demo
      - wow
      - MCP
    status: confirmed
    talk_description: |
      Hai mai desiderato creare il tuo gemini.google.com, ma con molta più personalità? ✨ In questo workshop, prenderai un'app Rails di esempio e le infonderai la magia di Gemini. Inizieremo aggiungendo un "tocco di brio" generando immagini divertenti 🖼️. Poi, costruiremo il cuore tecnico: il tuo server "Model Context Protocol" (MCP). Questo MCP �� esporrà le tue entità ActiveRecord, permettendo al tuo editor locale (o a Gemini CLI) di interrogare il tuo database usando nient'altro che il linguaggio naturale!
    image: /images/generated/DevFest-Modena-2025-2025-10-04.jpeg
  - title: 'Haunted Browsers, AI Cinema: Directing Your Story with Gemini CLI'
    event: DevFest Modena 2025
    date: '2025-10-04'
    location: Modena, Italy
    country_code: it
    event_url: https://devfest.modena.it/
    tags:
      - GenAI
      - DevFest
      - demo
      - wow
      - MCP
    status: confirmed
    session_url: https://sessionize.com/app/speaker/session/1032701
    sheetless_id: 9746
    talk_description: >
      In this session, we'll reveal the Gemini CLI as two revolutionary tools in one. First, we'll demo the "Haunted Browser": a web developer's dream. See how the Model Context Protocol (MCP) connects the LLM to Playwright, automating tedious web tasks like clicking buttons, logging in, and navigating sites—a true "new age curl".
      Then, for something completely different, we'll unveil the "AI Cinema": a creator's studio. Watch as we use the CLI to direct and generate entire, multi-step video storylines from a single prompt. 🤖
      Two powerful demos, one tool, and we'll show how we can automate in the cloud with GitHub Actions.
    image: /images/generated/DevFest-Modena-2025-2025-10-04.jpeg
