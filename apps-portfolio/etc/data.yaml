bio: >
  Riccardo Carlesso is a Developer Advocate at Google Cloud, where he helps
  developers build amazing applications. He is a passionate software engineer
  with a love for Ruby, Bash, and all things cloud. When he's not coding, you
  can find him speaking at conferences, writing articles, or watching Sacha
  Baron Cohen movies.
talks:
  - title: Building a Multi-Agent Real AI Travel Agent with Python and Ruby and MCP
    event: DevFest Pescara 2025
    date: '2025-11-08'
