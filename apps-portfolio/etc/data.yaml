  - title: Building a Multi-Agent Real AI Travel Agent with Python and Ruby and MCP
    event: DevFest Modena 2025
    date: '2025-10-04'
    location: Modena, Italy
    country_code: it
    event_url: https://devfest.modena.it/
    tags:
      - GenAI
      - python
      - demo
      - wow
    status: cfp_applied
    talk_description: >
      In 2025, an LLM agent needs to do more than just talk. It needs to do.
      This presentation is a hands-on look at building a truly useful AI travel
      agent with a multi-agent framework. Forget abstract concepts; we're diving
      straight into the code of a live demo that queries real APIs for flights,
      hotels 🏨, and AirB&Bs. We will cover how to structure a multi-agent
      system to handle complex, real-world tasks: validating budgets, managing
      user preferences, and visualizing results. You will learn how to implement
      an advanced, modular system that can be deployed on any cloud with any
      LLM. This is a technical L200-L300 session designed for developers who
      want to see how to coordinate agents and tools to create a seamless,
      end-to-end user experience.
    image: /images/generated/DevFest-Modena-2025-2025-10-04.jpeg
