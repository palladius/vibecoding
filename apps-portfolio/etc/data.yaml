  - title: 'Beyond Blame: The Art of the Postmortem'
    event: Codemotion Milan 2025
    date: '2025-10-14'
    location: Milan, Italy
    country_code: it
    sheetless_id: 9677
    session_url: https://sessionize.com/s/riccardo-carlesso/beyond-blame-the-art-of-the-postmortem/142465
    event_url: https://conferences.codemotion.com/milan2025/
    status: confirmed
    tags:
      - SRE
      - Postmortem
      - Culture
    talk_description: >
      This session addresses the challenges of postmortems, aiming to shift from
      a culture of blame to one of genuine learning. Riccardo Carlesso, an
      Italian SRE expert at Google, will dissect the anatomy of an effective
      postmortem, sharing real-world stories and insights. Attendees will learn
      when a postmortem is essential, how to adapt Google's foundational
      techniques, and how to transform failures into powerful business insights.
      The talk is for operators and leaders dedicated to building a culture of
      real resilience.
    image: /images/events/cloudconf25-riccardo-as-a-speaker.jpg

