  - title: 'Stop Grepping, Start Reasoning: Skill-Based Agentic SRE 🚀'
    event: Codemotion Milan 2026
    date: '2026-10-28'
    location: Milan, Italy
    country_code: it
    status: confirmed
    sheetless_id: 9971
    bug_id: 569926156
    event_url: https://conferences.codemotion.com/milan/
    event_description: 'Codemotion AI & Tech Conference Milan 2026 (28–29 Oct 2026, Superstudio Più) — Featured in Codemotion Magazine: https://www.codemotion.com/magazine/it/dev-life-it/eventi/multi-agent-e-troubleshooting-due-prospettive-sullai-agentica-a-codemotion-ai-tech-conference/'
    talk_description: 'Let’s be honest: debugging production at scale is manual labor.
      🫠 At Google, we decided making SREs act like human search engines was a bug,
      not a feature. Enter the Agentic SRE Extension—a skill-based framework that
      lives in your terminal and knows its way around Kubernetes. 🚀 In this deep dive,
      I’ll show you how we use modular skills and MCP to chain diagnostic tools, analyze
      metric regressions, and execute safe mitigations without "deleted production"
      anxiety. 🔥 We’ll dissect the "Outage Investigator" agent''s logic loop, see
      it draft a technical postmortem in seconds, and discuss why we built this as
      a portable framework whose skills can be leveraged by any modern AI harness.
      You’ll leave with the code to wire up your own Kubernetes stack and let the
      agent''s skills do the heavy lifting while you drink espresso. ☕️ No fluff,
      no 101s. Just AI agents, specialized skills, and less toil.'
    tags:
      - SRE
      - AI
      - Gemini
      - Kubernetes
      - Agentic
      - Milan
      - Italy
      - Codemotion
    image: /images/events/codemotion-milan-2026.jpg
    session_url: https://sessionize.com/app/speaker/session/1222188
