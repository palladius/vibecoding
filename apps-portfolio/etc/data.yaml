  - title: How to fail your SRE adoption (for Enterprises) | DOD Warsaw 2023
    event: DevOpsDays Warsaw 2023
    date: '2023-12-31'
    location: Warsaw, Poland
    country_code: pl
    session_url: https://www.youtube.com/watch?v=iSOSsnV1tJ0
    event_url: https://2023.devopsdays.pl/
    event_description: >
      What is DevOpsDays Warsaw?


      DevOpsDays is more than just a conference—it’s a global movement bringing
      together DevOps enthusiasts, developers, IT operations, management, CTOs,
      CEOs, sysadmins, and even sales & marketing teams. It’s where software
      development meets IT infrastructure, and where innovation, automation,
      security, and culture collide.


      The first-ever Polish edition took place over a decade ago, drawing in
      experts from all over Europe. Now, we’re back with an even bigger and
      better edition—ready to inspire, educate, and connect.
    talk_description: >
      I’ve been talking to customers re their SRE adoption since 2019.
      Oftentimes, they struggled in their effort to apply the Google methodology
      within their company. In this talk Riccardo will first set an introduction
      to SRE, then try to explain what failures patterns he's observed (partly
      contained in Enterprise Roadmap to SRE report)

      Topics: - What SRE is. - What SRE is not. - Anti-patterns in SRE adoption
      - How to make it work for your company

      DevOpsDays Warsaw: https://devopsdays.pl/
    status: delivered
    tags:
      - SRE
      - Culture
    image: /images/generated/DevOpsDays-Warsaw-2023-2023-12-31.jpeg
  - title: 'Goodbye, deployment headaches: Cloud Deploy and Vertex AI unite'
    event: Cloud Next
    date: '2024-04-11'
    location: Las Vegas, NV, USA
    country_code: us
    session_url: https://cloud.withgoogle.com/next?session=DEV302
    video_url: https://www.youtube.com/watch?v=_NlGk9Ao_oA
    slides_url: https://assets.swoogo.com/uploads/3794522-661c3c8fe0cf9.pdf
    status: delivered
    talk_description: >-
      Continuous Deployment can be a roadblock in the MLOps lifecycle, often
      requiring custom pipelines and complex configurations. Solution? The new
      integrations of Google Cloud Deploy and Vertex AI revolutionizes machine
      learning (ML) deployment by automating the entire process, and makes it
      easy to roll back through idempotent releases. The groundbreaking
      integration of Cloud Deploy and Vertex AI lets you test, validate, and
      deploy your ML models in minutes, without writing a single line of code.
    tags:
      - CloudDeploy
      - MLOps
      - highlight
      - CICD
    image: /images/generated/Cloud-Next-2024-04-11.jpeg
