# This Cloud Build file has a multi-stage deployment process.
# 1. Build and push the Docker image.
# 2. Deploy to a "development" Cloud Run service (`portfolio-app`).
# 3. Run the tests against the development service.
# 4. If the tests pass, deploy to the "production" Cloud Run service (`portfolio-app-prod`).

steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    id: Build
    dir: 'apps-portfolio'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/portfolio-app:latest'
      - '.'

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: Push
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/portfolio-app:latest'
    waitFor: ['Build']

  # 3. Deploy to development
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Deploy-Dev
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - "$_APP_NAME_DEV" # 'portfolio-app'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/portfolio-app:latest'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--quiet'
      - '--set-env-vars=NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL'
      - '--set-env-vars=RICC_ENV=$_RICC_ENV'
    env:
      - 'NEXT_PUBLIC_API_URL=https://portfolio-app-272932496670.europe-west1.run.app/'
      #- '_RICC_ENV=$_RICC_ENV' # lets see if its needed
      #- 'APP_NAME=portfolio-app'

    waitFor: ['Push']

  # 4. Run tests against the development service
  - name: 'gcr.io/cloud-builders/npm'
    id: Test
    entrypoint: 'npx'
    dir: 'apps-portfolio'
    args: ['vitest', 'run']
    env:
      - 'DATABASE_URL=file:./db/portfolio.sqlite3'
    waitFor: ['Deploy-Dev']

  # 5. Deploy to production
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Deploy-Prod
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      #- 'portfolio-app-prod'
      - "$_APP_NAME_PROD" # 'portfolio-app-prod'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/portfolio-app:latest'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--quiet'
      - '--set-env-vars=NEXT_PUBLIC_API_URL=$_NEXT_PUBLIC_API_URL'
      - '--set-env-vars=RICC_ENV=$_RICC_ENV'
    env:
      - 'NEXT_PUBLIC_API_URL=https://portfolio-app-prod-272932496670.europe-west1.run.app/'
      - 'RICC_ENV=CloudBuild.yaml'
    waitFor: ['Test']

# Store the image in Artifact Registry
images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/portfolio-app:latest'

# https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
# COMMON ENV VARS
substitutions:
    #_NODE_VERSION_1: v6.9.1 # default value
    #_NODE_VERSION_2: v6.9.2 # default value
    _CLOUD_RUN_REGION: 'europe-west1'
    _APP_NAME_DEV: 'portfolio-app'
    _APP_NAME_PROD: 'portfolio-app-prod'
    _NEXT_PUBLIC_API_URL_DEV: "https://${_APP_NAME_DEV}-$PROJECT_NUMBER.$CLOUD_RUN_REGION.run.app/"
    _NEXT_PUBLIC_API_URL_PROD: "https://${_APP_NAME_PROD}-$PROJECT_NUMBER.$CLOUD_RUN_REGION.run.app/"
    _RICCARDO_ELUCUBRATIONS: |
      I'm trying to deploy to dev and prod using Cloud Build and somewhat to make it programmatic to calculate the URLs for dev and prod.
      https://portfolio-app-272932496670.europe-west1.run.app/ could go south very quickly, exp if I use custom domains.
    _RICC_ENV: 'CloudBuild.yaml'

options:
    substitutionOption: 'ALLOW_LOOSE'

# Set a timeout for the build
timeout: '1200s'
