# VibeCheck Configuration

# Global settings
cache_duration: 86400 # 24 hours in seconds
report_email: "palladiusbonton@gmail.com"
output_folder: "./reports"
modules:
    disk_space:
        node_modules:
            module: "folder_scanner"
            name: "Node.js (node_modules)"
            description: "Find all node_modules/ folders and calculate their total size."
            enabled: true
            followup_action: "prompt-user"
            start_path: "~/git"
            folder_patterns: ["**/node_modules"]
        python_temp_folders:
            module: "folder_scanner"
            name: "Python (__pycache__, .venv)"
            description: "Find and calculate the size of Python temporary folders."
            enabled: true
            followup_action: "prompt-user"
            start_path: "~/git"
            folder_patterns: ["**/__pycache__", "**/.venv"]
        ruby_temp_folders:
            module: "folder_scanner"
            name: "Ruby (vendor/bundle)"
            description: "Find and calculate the size of Ruby temporary folders."
            enabled: true
            followup_action: "prompt-user"
            start_path: "~/git"
            folder_patterns: ["**/vendor/bundle"]
        docker_images:
            description: "Analyze Docker images and offer to prune dangling images."
            enabled: true
            followup_action: "prompt-user"
        apt_size:
            description: "Check the size of apt/brew cache and suggest cleanup."
            enabled: true
            # brew cleanup
            followup_action: "prompt-user"
        overall_disk_usage:
            description: "Check the overall disk usage of the root partition."
            enabled: true
        python_temp_folders:
            description: "Find and calculate the size of Python temporary folders (__pycache__, .venv)."
            enabled: true
            followup_action: "auto-accept"
        ruby_temp_folders:
            description: "Find and calculate the size of Ruby temporary folders (vendor/bundle)."
            enabled: true
            followup_action: "prompt-user"
    assertions:
        repos_exist:
            description: "Check that all essential repositories exist on the filesystem."
            enabled: true
            repositories:
                - path: "~/git/sakura"
                  description: "My public personal repo"
                - path: "~/git/gic"
                  description: "My personal private repo"
                - path: "~/Desktop"
                  description: "Desktop folder shoudl exist"
